name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: |
            # Fail the job on ANY failing step, not just the build. Previously a
            # broken `git pull` or `up -d` still reported success.
            set -euo pipefail

            cd /opt/BeeFame

            echo "=== Pulling latest code ==="
            git fetch origin main
            # --ff-only: refuse to deploy if the server has diverged from main,
            # rather than silently discarding whatever is there.
            git merge --ff-only origin/main
            echo "Now at: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            echo "=== Rebuilding changed images ==="
            # One service at a time: building all three in parallel can exhaust the server's 3 GB of RAM.
            : > /tmp/build.log
            for service in backend beespector frontend; do
              if ! docker compose build "$service" 2>&1 | tee -a /tmp/build.log; then
                echo "=== BUILD FAILED ($service), last 50 lines ==="
                tail -50 /tmp/build.log
                exit 1
              fi
            done

            echo "=== Restarting services ==="
            # --remove-orphans clears containers left by older compose files that
            # would otherwise keep holding ports 3001/8000.
            docker compose up -d --remove-orphans

            echo "=== Running containers ==="
            docker compose ps

            echo "=== Waiting for services to start ==="
            sleep 20

            echo "=== Health check ==="
            FAILED=0

            if curl -sf http://localhost:8000/status > /dev/null; then
              echo "Backend OK"
            else
              echo "FAIL: backend /status unreachable"; FAILED=1
            fi

            if curl -sf http://localhost:8001/docs > /dev/null; then
              echo "Beespector OK"
            else
              echo "FAIL: beespector /docs unreachable"; FAILED=1
            fi

            # Verifies the running frontend is the CURRENT build: this proxy route
            # only exists post-refactor, so a 404 means a stale image is serving.
            if curl -sf http://localhost:3001/api/backend/datasets > /dev/null; then
              echo "Frontend OK (proxy route reachable)"
            else
              echo "FAIL: frontend /api/backend/datasets unreachable — stale build or backend down"; FAILED=1
            fi

            if [ $FAILED -ne 0 ]; then
              echo "=== DEPLOY FAILED health check ==="
              docker compose logs --tail=40
              exit 1
            fi

            # Each build leaves the previous images dangling; drop them so the disk does not fill up.
            # Keep up to 3 GB of build cache so unchanged pip/npm layers are not rebuilt next time.
            docker image prune -f
            docker builder prune -f --max-used-space 3GB

            echo "=== Deploy complete ==="
