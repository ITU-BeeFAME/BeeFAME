services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - beefame

  beespector:
    restart: unless-stopped
    build:
      context: ./beespector
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - beefame

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - BEESPECTOR_INTERNAL_URL=http://beespector:8001
    depends_on:
      - backend
      - beespector
    networks:
      - beefame

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --appendonly yes
    networks:
      - beefame

networks:
  beefame:
    driver: bridge

volumes:
  redis_data:
